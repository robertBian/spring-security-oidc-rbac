services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    ports: ["8081:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-dev-admin-only
    volumes:
      - ./keycloak/portfolio-realm.json:/opt/keycloak/data/import/portfolio-realm.json:ro
